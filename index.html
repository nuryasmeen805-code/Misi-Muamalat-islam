.screen{background-size:cover;background-position:center}.top{background:#ffffffb8;border-radius:12px;padding:4px 10px}.mt{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));z-index:5;border:0;border-radius:50%;width:42px;height:42px;font-size:20px;background:#fffd;cursor:pointer;box-shadow:0 2px 6px #0004}.board{background:#fff8e7;border:9px solid #8b5a2b;outline:3px solid #c98b4a;border-radius:18px;box-shadow:0 8px 0 #0004;padding:14px 22px;text-align:center;max-width:540px;width:100%;animation:drop .9s cubic-bezier(.3,1.4,.5,1)}.board h1{margin:6px 0 2px;color:#000;font-size:clamp(26px,5.4vw,52px);line-height:1.05}.board p{margin:0;color:#000;font-weight:700;font-size:clamp(12px,2vw,17px)}.tag{display:inline-block;background:#1E8E5A;color:#fff;font-weight:800;font-size:clamp(10px,1.6vw,13px);padding:3px 12px;border-radius:10px}.pic.hero2{height:clamp(170px,40vw,400px);max-width:36%;animation:slide .9s ease-out,bob 2.4s ease-in-out .9s infinite}.start{font-size:22px;padding:14px 46px;animation:pulse 1.6s ease-in-out infinite}@keyframes drop{from{transform:translateY(-130%);opacity:0}to{transform:none;opacity:1}}@keyframes slide{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}@keyframes pulse{50%{transform:scale(1.07)}}
.sc{position:absolute;inset:0;overflow:hidden;pointer-events:none;background:linear-gradient(#6ec3f2,#bfe8fb 55%,#fff1c9)}.sc *{pointer-events:none}.sun{position:absolute;right:7%;top:13%;width:clamp(60px,10vw,110px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fffbd0,#FFC93C 60%,#ffb300);box-shadow:0 0 50px 18px #ffe58a99;animation:glow 4s ease-in-out infinite alternate}.sun::before{content:'';position:absolute;inset:-70%;border-radius:50%;background:repeating-conic-gradient(#fff3a855 0 7deg,transparent 7deg 22deg);-webkit-mask-image:radial-gradient(circle,#000 25%,transparent 68%);mask-image:radial-gradient(circle,#000 25%,transparent 68%);animation:spin 50s linear infinite}.cl{position:absolute;left:-25%;display:block;background:#fff;border-radius:50px;opacity:.92;animation:drift linear infinite}.cl::before,.cl::after{content:'';position:absolute;background:#fff;border-radius:50%}.cl::before{width:50%;height:150%;left:14%;top:-75%}.cl::after{width:36%;height:115%;left:50%;top:-48%}.sp{position:absolute;color:#fff;font-size:18px;opacity:0;animation:rise2 5s ease-in infinite}.sky{position:absolute;left:0;bottom:12%;width:100%;height:48%}.awn{position:absolute;left:0;right:0;bottom:12%;height:20px;background:repeating-linear-gradient(90deg,#F28C28 0 36px,#fff 36px 72px);border-radius:6px 6px 0 0;box-shadow:0 4px 0 #0002}.gr{position:absolute;left:0;right:0;bottom:0;height:12%;background:linear-gradient(#7fc48a,#4aa05f)}.bun{position:absolute;left:0;top:0;width:100%;height:58px}.fl{transform-box:fill-box;transform-origin:50% 0;animation:swing 2.4s ease-in-out infinite alternate}.fg{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;padding-top:34px;min-height:0}.crew{display:flex;align-items:flex-end;justify-content:center;gap:3%;margin-bottom:10px;flex:1;min-height:0;width:100%}.crew>.plaque{flex:1;min-width:0}.nav{position:relative;z-index:1}.plaque{position:relative;background:linear-gradient(#fffdf3,#fff3cf);border:4px solid #c9a227;border-radius:22px;box-shadow:0 0 0 6px #1E8E5A,0 12px 0 6px #0b4d3144;padding:12px 28px 10px;text-align:center;max-width:640px;animation:drop .9s cubic-bezier(.3,1.4,.5,1)}.plaque::before,.plaque::after{content:'✦';position:absolute;top:-22px;font-size:28px;color:#c9a227;animation:spin 9s linear infinite}.plaque::before{left:14px}.plaque::after{right:14px}.plaque h1{margin:6px 0 0;color:#000;font-size:clamp(24px,4.4vw,44px);line-height:1.05}.plaque p{margin:2px 0 0;color:#000;font-weight:700;font-size:clamp(12px,2vw,17px)}.lt{display:inline-block;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}.shn{height:5px;border-radius:4px;margin:8px auto 4px;width:72%;background:linear-gradient(90deg,transparent,#FFC93C,#fff,#FFC93C,transparent) 0 0/200% 100%;animation:shine 2.4s linear infinite}.pic.hero3{height:clamp(105px,17vw,185px);max-width:31%;filter:drop-shadow(0 8px 6px #0005);animation:rise .8s cubic-bezier(.3,1.5,.5,1) both,bob 2.6s ease-in-out infinite}.pic.hero3.mid{height:clamp(120px,20vw,215px)}.crew .pic:nth-child(1){animation-delay:.2s,1s}.crew .pic:nth-child(2){animation-delay:.45s,1.3s}.crew .pic:nth-child(3){animation-delay:.7s,1.6s}.btn.start{background:#F28C28;font-size:22px;padding:13px 48px;border-radius:40px;animation:ring 1.7s ease-out infinite}.fu{animation:fu .6s both}.gl{animation:glow2 2.6s ease-in-out infinite alternate}@keyframes ring{0%{box-shadow:0 5px 0 #b9650f,0 0 0 0 #F28C28aa}100%{box-shadow:0 5px 0 #b9650f,0 0 0 24px #F28C2800}}@keyframes pop{from{transform:translateY(34px) scale(.3);opacity:0}to{transform:none;opacity:1}}@keyframes rise{from{transform:translateY(90px) scale(.5);opacity:0}to{transform:none;opacity:1}}@keyframes fu{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes glow{to{box-shadow:0 0 70px 28px #ffe58acc}}@keyframes glow2{to{box-shadow:0 0 22px 6px #FFC93Cbb}}@keyframes drift{to{left:112%}}@keyframes swing{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}@keyframes rise2{0%{opacity:0;transform:translateY(0) scale(.5)}30%{opacity:.9}100%{opacity:0;transform:translateY(-120px) scale(1.2)}}@keyframes drop{from{transform:translateY(-130%);opacity:0}to{transform:none;opacity:1}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
@media(max-width:560px){.pic.hero3{height:150px}.pic.hero3.mid{height:172px}}
.screen>*:not(.sc){position:relative;z-index:1}.top{background:linear-gradient(#fffdf3,#fff3cf);border:3px solid #c9a227;border-radius:16px;box-shadow:0 0 0 4px #1E8E5A,0 7px 0 4px #0b4d3133;padding:6px 16px;margin:6px 6px 12px;animation:drop .6s cubic-bezier(.3,1.3,.5,1) backwards}.top h2{color:#000;font-size:clamp(16px,2.8vw,24px)}.card{border:3px solid #e6c875;animation:fu .5s backwards}.menu .stall{position:relative;overflow:hidden;padding-top:26px;animation:rise .6s cubic-bezier(.3,1.5,.5,1) backwards}.menu .stall::before{content:'';position:absolute;left:0;right:0;top:0;height:14px;background:repeating-linear-gradient(90deg,#ffffffd9 0 14px,transparent 14px 28px)}.menu .stall:nth-child(1){animation-delay:.15s}.menu .stall:nth-child(2){animation-delay:.3s}.menu .stall:nth-child(3){animation-delay:.45s}.menu .stall:nth-child(4){animation-delay:.6s}.grid5>.flip{animation:pop .5s backwards}.grid5>.flip:nth-child(2){animation-delay:.1s}.grid5>.flip:nth-child(3){animation-delay:.2s}.grid5>.flip:nth-child(4){animation-delay:.3s}.grid5>.flip:nth-child(5){animation-delay:.4s}.opt:hover{border-color:#F28C28}table{background:#fffdf3;border-radius:12px;overflow:hidden}.bubble{background:#fff;border:3px solid #e6c875;border-radius:16px;padding:6px 12px;font-size:14px;font-weight:800;text-align:center;margin-bottom:6px;animation:pop .6s .9s backwards}.gr.s{height:7%}.still,.still *{animation:none!important}
.gw{display:flex;flex-direction:column;align-items:center;flex:none;width:26%}.pic.hero3.mid.solo{max-width:100%;height:clamp(170px,30vw,300px)}@media(max-width:560px){.mb{flex-direction:column;gap:4px}.gw{flex-direction:row;align-items:flex-end;width:auto;gap:8px}.gw .bubble{margin-bottom:30px}.pic.hero3.mid.solo{height:110px}.mb .menu{grid-template-columns:1fr 1fr!important;gap:8px}.mb .stall{min-height:92px;font-size:12px;padding:26px 6px 8px}}
.screen>.body{min-height:auto}
@media(max-width:560px){.stage{aspect-ratio:auto;height:calc(100vh - 20px);height:calc(100dvh - 20px);min-height:560px}}
@keyframes in{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
h1,h2{margin:0;font-weight:800}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:34px}
.bar{height:8px;background:#fff9;border-radius:8px;flex:1;max-width:220px;overflow:hidden}.bar i{display:block;height:100%;background:var(--orange);transition:width .4s}

.col{flex-direction:column;align-items:stretch;justify-content:center}
.card{background:var(--cream);border-radius:18px;padding:14px 18px;box-shadow:0 4px 0 #0002;width:100%}
.btn{border:0;border-radius:14px;background:var(--orange);color:#fff;font:800 14px Nunito,sans-serif;padding:10px 16px;cursor:pointer;box-shadow:0 4px 0 #b9650f;min-height:44px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b9650f}.btn.g{background:var(--green);box-shadow:0 4px 0 #136640}.btn.r{background:#d9534f;box-shadow:0 4px 0 #9c2f2b}

.slogan{text-align:center;font-size:14px;font-weight:700;color:#000;margin:2px 0}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;max-width:560px}
.stall{border:0;border-radius:18px;color:#fff;font:800 clamp(13px,2.2vw,17px) Nunito,sans-serif;padding:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 6px 0 #0003;transition:transform .15s;min-height:84px}
.stall:hover{transform:translateY(-4px) rotate(-1deg)}.stall span{font-size:34px}
@media(max-width:560px){.menu{grid-template-columns:1fr}.pic{height:120px;font-size:38px;max-width:30%}.pic.sit{width:42vw;height:auto;max-width:44%}}
.ayat{font-family:'Amiri Quran','Scheherazade New',serif;font-size:clamp(26px,5vw,44px);direction:rtl;text-align:center;color:#0b4d31;line-height:1.8;border:3px double #c9a227;border-radius:16px;padding:6px 12px;background:#fffdf3}
.sm{font-size:clamp(13px,2vw,16px);margin:6px 0 0}
.flip{perspective:600px;height:100px;cursor:pointer}.flip>div{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}.flip.f>div{transform:rotateY(180deg)}

.flip b{background:var(--green);color:#fff;font-size:15px}.flip p{background:#fff;transform:rotateY(180deg);font-weight:600}
.grid5{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;width:100%}
.opt{display:block;width:100%;text-align:left;background:#fff;border:3px solid #fff;border-radius:12px;padding:9px 12px;margin-top:7px;font:700 clamp(13px,2vw,16px) Nunito,sans-serif;cursor:pointer;color:#1d2b24}
.opt.sel{border-color:var(--orange);background:#fff1dc}.opt.ok,.ok{border-color:var(--green)!important;background:#dcf5e6!important}.opt.no,.no{border-color:#d9534f!important;background:#fde3e2!important}
.fb{min-height:38px;font-size:14px;font-weight:700;margin-top:6px}
.stars{font-size:28px;letter-spacing:4px;color:#d99a00}

input{width:100%;padding:11px;border-radius:12px;border:3px solid #fff;font:700 16px Nunito,sans-serif;margin-top:4px}

table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px;border-bottom:1px solid #0002;text-align:left;vertical-align:top}

<script>
/* ===== TETAPAN: sunting fail config.js, bukan di sini ===== */
const VIDEO_URL=(window.CONFIG&&CONFIG.videoUrl)||"";   // dibaca daripada config.js
const SCRIPT_URL=(window.CONFIG&&CONFIG.scriptUrl)||"";  // dibaca daripada config.js
/* ===================================== */
const V=document.getElementById('v');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function fb(img,e){const s=document.createElement('span');s.className=img.className;s.textContent=e;img.replaceWith(s)}
const ik=(n,e)=>`<img class="ik" src="assets/${n}.png" alt="" onerror="this.replaceWith(document.createTextNode('${e}'))">`;
const pic=(n,e,c='')=>`<img class="pic ${c}" src="assets/${n}.png" alt="" onerror="fb(this,'${e}')">`;
let BG='latar-menu',QUICK=0;const view=h=>{const sc=(BG==='x'||LATAR[BG])?'':scene(BG!=='latar-menu');V.innerHTML='<div class="screen'+(QUICK?' still':'')+'" style="'+(BG==='x'?'':'background-image:url(assets/'+BG+'.png)')+'">'+sc+h+'</div>';QUICK=0};
const hd=(t,p,l)=>`<div class="top"><h2>${t}</h2>${p!=null?`<div class="bar"><i style="width:${p}%"></i></div>`:''}<span>${l||''}</span></div>`;

/* ---- Skrin asas ---- */
const SKY='<svg class="sky" viewBox="0 0 1000 220" preserveAspectRatio="xMidYMax slice"><path d="M0 220V190Q150 140 300 190T600 180T1000 185V220Z" fill="#9fdca8" opacity=".7"/><path d="M120 220V170Q120 120 170 120Q220 120 220 170V220Z" fill="#2fa56f"/><path d="M780 220V170Q780 120 830 120Q880 120 880 170V220Z" fill="#2fa56f"/><rect x="300" y="70" width="36" height="150" fill="#136640"/><path d="M296 72L318 32L340 72Z" fill="#1E8E5A"/><circle cx="318" cy="28" r="6" fill="#FFC93C"/><rect x="664" y="70" width="36" height="150" fill="#136640"/><path d="M660 72L682 32L704 72Z" fill="#1E8E5A"/><circle cx="682" cy="28" r="6" fill="#FFC93C"/><rect x="360" y="140" width="280" height="80" fill="#1E8E5A"/><path d="M385 145V125Q385 55 500 55Q615 55 615 125V145Z" fill="#26a368"/><rect x="497" y="28" width="6" height="30" fill="#c9a227"/><path d="M500 6A14 14 0 1 0 500 34A11 11 0 1 1 500 6Z" fill="#FFC93C"/><path d="M468 220V188Q468 166 500 166Q532 166 532 188V220Z" fill="#0b4d31"/><path d="M390 220V190Q390 172 408 172Q426 172 426 190V220Z" fill="#136640"/><path d="M574 220V190Q574 172 592 172Q610 172 610 190V220Z" fill="#136640"/></svg>';
function scene(l){let f='';for(let i=0;i<12;i++){const x=45+i*82,t=x/1000,y=(1-t)*(1-t)*6+2*t*(1-t)*74+t*t*6;f+='<polygon class="fl" style="animation-delay:'+((i%4)*.35)+'s" fill="'+['#F28C28','#FFC93C','#4DB6E8','#1E8E5A'][i%4]+'" points="'+(x-16)+','+y.toFixed(1)+' '+(x+16)+','+y.toFixed(1)+' '+x+','+(y+34).toFixed(1)+'"/>'}
 const sp=[[8,30,0],[22,52,1.2],[38,24,2.4],[55,46,.6],[70,28,3],[84,50,1.8],[93,34,3.8]].map(s=>'<b class="sp" style="left:'+s[0]+'%;top:'+s[1]+'%;animation-delay:'+s[2]+'s">✦</b>').join('');
 return '<div class="sc"><div class="sun"></div><i class="cl" style="top:14%;width:120px;height:32px;animation-duration:40s"></i><i class="cl" style="top:28%;width:90px;height:24px;animation-duration:55s;animation-delay:-22s"></i><i class="cl" style="top:9%;width:150px;height:38px;animation-duration:68s;animation-delay:-45s"></i>'+sp+(l?'':SKY+'<div class="awn"></div>')+'<div class="gr'+(l?' s':'')+'"></div><svg class="bun" viewBox="0 0 1000 80" preserveAspectRatio="none"><path d="M0 6Q500 74 1000 6" fill="none" stroke="#8b5a2b" stroke-width="3"/>'+f+'</svg></div>'}

 view(scene()+`<div class="fg"><div class="plaque"><span class="tag">PENDIDIKAN ISLAM TINGKATAN 4</span><h1>${t}</h1><div class="shn"></div><p class="fu" style="animation-delay:1.6s">Bijak Bermuamalah, Berkat Kehidupan</p></div><div class="crew">${pic('murid-perempuan','🧕','hero3')}${pic('guru','👨‍🏫','hero3 mid')}${pic('murid-lelaki','🧑‍🎓','hero3')}</div><button class="btn start" onclick="menu()">▶ MULA</button></div>`)}
function menu(){view(`<div class="plaque" style="align-self:center;padding:6px 26px;margin-top:6px"><h1 style="font-size:clamp(20px,3.6vw,32px);margin:0">Misi Muamalat Islam</h1><p>Bijak Bermuamalah, Berkat Kehidupan</p></div><div class="body mb"><div class="gw"><div class="bubble">Jom mulakan misi!</div>${pic('guru','👨‍🏫','hero3 mid solo')}</div><div class="menu">

<button class="stall" style="background:var(--orange)" onclick="nota(0)"><span>${ik('ikon-nota','📖')}</span>NOTA PEMBELAJARAN</button>

async function hantar(){
